<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
      // GitHub Pages SPA fallback for /ProvidentFundFrontend/ subpath
      // When a route doesn't exist, GitHub Pages returns 404.html
      // We capture the path and redirect to index, letting React Router handle it
      
      (function() {
        var l = window.location;
        var pathname = l.pathname;
        
        // Store the path that was requested (without the app base)
        // This will be picked up by index.html
        if (pathname.includes('/ProvidentFundFrontend/')) {
          // Extract the route after /ProvidentFundFrontend/
          var route = pathname.replace('/ProvidentFundFrontend/', '/');
          sessionStorage.setItem('redirect_to', route + l.search + l.hash);
        }
        
        // Redirect to root index (which handles the redirect)
        l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/ProvidentFundFrontend/');
      })();
    </script>
  </head>
  <body>
  </body>
</html>
