  <body>
    <div id="root"></div>
    <script>
      // Handle redirects from 404.html for GitHub Pages SPA routing
      (function() {
        var redirect = sessionStorage.getItem('redirect_to');
        if (redirect) {
          sessionStorage.removeItem('redirect_to');
          // Let React Router handle the navigation via basename
          // The redirect happens by setting the URL correctly
          if (redirect !== '/') {
            history.replaceState(null, null, '/ProvidentFundFrontend' + redirect);
          }
        }
      })();
    </script>
